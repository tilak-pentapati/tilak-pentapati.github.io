project:
  type: website
  output-dir: docs
  # data/ holds raw (gitignored) datasets incl. QGIS .qmd sidecars and
  # notebooks that must never be rendered as pages.
  render:
    - "*.qmd"
    - "!data/"
  resources:
    - .nojekyll

execute:
  freeze: auto

website:
  title: "Jay Tilak Pentapati"
  description: "Geographic data science and engineering portfolio of Jay Tilak Pentapati: spatial analysis, statistical modelling, machine learning and systems design."
  site-url: https://tilak-pentapati.github.io
  favicon: favicon.svg
  image: pic_linkedin_V2.jpg
  open-graph: true
  twitter-card: true
  search: true
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  repo-url: https://github.com/tilak-pentapati/tilak-pentapati.github.io
  repo-branch: main
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
    right:
      - icon: github
        href: https://github.com/tilak-pentapati
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://linkedin.com/in/jay-tilak-pentapati
        aria-label: LinkedIn
        target: _blank
  page-footer:
    left: "© 2023–2026 Jay Tilak Pentapati"
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - icon: github
        href: https://github.com/tilak-pentapati
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/jay-tilak-pentapati
        aria-label: LinkedIn

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    embed-resources: false
