<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle Analytical Grid -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <line x1="100" y1="120" x2="1100" y2="120" />
    <line x1="100" y1="220" x2="1100" y2="220" />
    <line x1="100" y1="320" x2="1100" y2="320" />
    <line x1="100" y1="420" x2="1100" y2="420" />
    <line x1="100" y1="520" x2="1100" y2="520" />
    
    <line x1="200" y1="100" x2="200" y2="540" />
    <line x1="400" y1="100" x2="400" y2="540" />
    <line x1="600" y1="100" x2="600" y2="540" />
    <line x1="800" y1="100" x2="800" y2="540" />
    <line x1="1000" y1="100" x2="1000" y2="540" />
  </g>

  <!-- Regression Data Points & Curves (Abstract Statistical Vibe) -->
  <g opacity="0.6">
    <!-- Confidence Interval / Variance Area -->
    <path d="M 180 500 Q 450 420, 700 280 T 1050 170 L 1050 230 Q 700 330, 450 460 T 180 520 Z" fill="#10B981" opacity="0.08"/>
    <!-- OLS Trendline -->
    <path d="M 180 510 Q 450 440, 700 300 T 1050 200" fill="none" stroke="url(#trendGrad)" stroke-width="4" filter="url(#glowGreen)"/>
  </g>

  <!-- Data Nodes (Scatter Plot) -->
  <g fill="#10B981" opacity="0.75">
    <circle cx="240" cy="490" r="5" fill="#06B6D4" filter="url(#glowGreen)"/>
    <circle cx="310" cy="460" r="4"/>
    <circle cx="380" cy="470" r="6"/>
    <circle cx="430" cy="410" r="5"/>
    <circle cx="510" cy="390" r="6" fill="#34D399" filter="url(#glowGreen)"/>
    <circle cx="580" cy="340" r="4"/>
    <circle cx="650" cy="350" r="5"/>
    <circle cx="720" cy="270" r="7" fill="#34D399" filter="url(#glowGreen)"/>
    <circle cx="790" cy="300" r="5"/>
    <circle cx="860" cy="240" r="6"/>
    <circle cx="940" cy="210" r="7" fill="#06B6D4" filter="url(#glowGreen)"/>
    <circle cx="1010" cy="180" r="5"/>
  </g>

  <!-- Stylised Eco-Home Icon -->
  <g transform="translate(600, 160)" filter="url(#glowCyan)">
    <!-- House outline -->
    <path d="M -45 10 L 0 -28 L 45 10 L 30 10 L 30 40 L -30 40 L -30 10 Z" fill="none" stroke="#10B981" stroke-width="3" stroke-linejoin="round"/>
    <!-- Heat/Eco Radiating Leaf Curve -->
    <path d="M -5 32 C -5 20, 15 15, 15 5 C 15 15, 0 22, -5 32 Z" fill="#34D399"/>
  </g>

  <!-- Title Text: Exactly 5 Words -->
  <text x="600" y="320" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="1.5" 
        text-anchor="middle" 
        fill="url(#textGrad)">
    Modelling UK Green Central Heating
  </text>

  <!-- Minimal Decorative Status Tag -->
  <rect x="525" y="350" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="540" cy="363" r="4" fill="#10B981"/>
  <text x="605" y="367" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">CENSUS 2021</text>
</svg>