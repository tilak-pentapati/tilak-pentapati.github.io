# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["Airbnb", "spatial autocorrelation", "Moran's I", "LISA", "K-means", "geodemographic classification", "San Francisco Bay Area"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/r/airbnb_sf/index.qmd
summary:
  problem: "Which neighbourhood characteristics shape Airbnb activity across Bay Area ZIP codes, and how can policymakers target areas?"
  data: "Inside Airbnb listings (San Francisco, Oakland, San Mateo), ACS 2016–2020 income and broadband (tidycensus), ZCTA boundaries, vehicles and commercial electricity rates per ZIP (2020)."
  methods: "Queen-contiguity weights, global Moran's I (Monte Carlo) and LISA, multivariate K-means geodemographic clustering, in EPSG:2227."
  result: "Airbnb listings cluster in San Francisco and Oakland ZIP codes with high internet use and medium-to-high household income."
  stack: ["R", "sf", "tidycensus", "spdep", "tmap", "cluster"]
# Short label for the home-page skills network.
short_title: "Bay Area Airbnb"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "San Francisco Bay Area (SF, Oakland, San Mateo)"
  scope: city
  lat: 37.7
  lon: -122.33
  radius_km: 22

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "Inside Airbnb listings: San Francisco, Oakland, San Mateo County"
      url: "https://insideairbnb.com/get-the-data/"
      licence: "CC BY 4.0"
      fetch: "Download `listings.csv` and `neighbourhoods.csv` for each city."
      path: "`data/data_r/airbnb_sf/tables/` (committed)"
    - name: "American Community Survey 2016–2020 (income, broadband) via tidycensus"
      url: "https://api.census.gov/data/key_signup.html"
      licence: "US Government work (public domain)"
      fetch: "Fetched at render time; needs a free Census API key in the `CENSUS_API_KEY` environment variable."
      path: "none (API)"
    - name: "Bay Area ZIP code areas, utility rates by ZIP (2020), vehicle counts by ZIP (2020)"
      url: "https://geodata.lib.berkeley.edu/"
      licence: "Public agency open data (UC Berkeley GeoData, NREL/OpenEI, California Open Data); see each source page"
      fetch: "Already in the repository."
      path: "`data/data_r/airbnb_sf/bayarea_zipcodes/` and `tables/` (committed)"
  note: "The data this page reads is committed, so only the Census API key is needed. Paths are relative to the project root."
