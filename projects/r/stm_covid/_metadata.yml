# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["COVID-19", "multilevel modelling", "geographically weighted regression", "spatio-temporal modelling", "Fixed Rank Kriging", "negative binomial", "England"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/r/stm_covid/index.qmd
summary:
  problem: "What drove local COVID-19 infection risk in England's third (Alpha) wave, and how did it spread?"
  data: "Daily COVID-19 cases for 149 upper-tier local authorities in 9 regions (Dec 2020 – Jan 2021) with census covariates."
  methods: "Multilevel varying-intercept and varying-slope models, fixed and adaptive GWR, Fixed Rank Kriging basis functions in Poisson and negative binomial space-time GLMs."
  result: "Overcrowding, ethnic diversity and long-term illness raise risk; the negative binomial cuts deviance from 171,098 to 9,261; a significant latitude × time term shows south-to-north spread."
  stack: ["R", "lme4", "spgwr", "FRK", "spacetime", "sf", "tmap"]
# Short label for the home-page skills network.
short_title: "COVID-19 England"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "England (149 upper-tier local authorities)"
  scope: national
  lat: 52.6
  lon: -1.2

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "COVID-19 cases by upper-tier local authority with 2011 Census covariates (`covid19_eng.gpkg`)"
      url: "https://coronavirus.data.gov.uk"
      licence: "Open Government Licence v3.0 (UKHSA dashboard, ONS Census 2011, IMD 2019)"
      fetch: "Course-prepared GeoPackage (Rowe & Arribas-Bel, Spatial Modelling for Data Scientists); rebuild from the UKHSA dashboard and Census tables."
      path: "`data/data_r/stm_covid/assignment_2_covid/covid19_eng.gpkg`"
    - name: "Regions (December 2019) Boundaries EN BGC"
      url: "https://geoportal.statistics.gov.uk/"
      licence: "Open Government Licence v3.0 (contains OS data © Crown copyright)"
      fetch: "Download from the ONS Open Geography Portal."
      path: "`data/data_r/stm_covid/gwr/Regions_December_2019_Boundaries_EN_BGC.shp`"
  note: "The page loads the data from the expected paths, relative to the project root."
