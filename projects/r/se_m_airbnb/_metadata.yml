# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["Airbnb", "Madrid", "point pattern analysis", "IDW interpolation", "predictive checks", "spatial econometrics", "spatial lag"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/r/se_m_airbnb/index.qmd
summary:
  problem: "How are Madrid Airbnb prices distributed in space, and what drives them?"
  data: "Madrid Airbnb listings GeoPackage: nightly price, capacity, rooms, amenities, neighbourhood and distance to El Retiro Park."
  methods: "KDE and hex binning, IDW interpolation, OLS with simulation-based predictive checks, neighbourhood fixed effects and spatial regimes, k = 50 nearest-neighbour spatial lags, Moran's I."
  result: "The log-price model raises R² from 0.023 to 0.244 and passes predictive checks; adding spatial lags and distance to El Retiro reaches R² = 0.251."
  stack: ["R", "sf", "gstat", "spdep", "spatialreg", "arm", "tmap"]
# Short label for the home-page skills network.
short_title: "Madrid Airbnb"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "Madrid"
  scope: city
  lat: 40.4168
  lon: -3.7038
  radius_km: 10

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "Madrid Airbnb listings GeoPackage (`madrid_abb.gpkg`)"
      url: "https://insideairbnb.com/get-the-data/"
      licence: "CC BY 4.0 (Inside Airbnb); cleaned for the University of Liverpool spatial modelling course"
      fetch: "Download Madrid `listings.csv` from Inside Airbnb and run the cleaning notebook kept alongside the data (`clean_data.ipynb`)."
      path: "`data/data_r/se_m_airbnb/assignment_1_madrid/madrid_abb.gpkg`"
  note: "The page loads the GeoPackage from the expected path, relative to the project root."
