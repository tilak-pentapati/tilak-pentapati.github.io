<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0f192b"/>
      <stop offset="60%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Hotspot Radial Gradients -->
    <radialGradient id="hotspotRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b56" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff3b56" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3b56" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="hotspotAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff9f0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter for Neural & Data Lines -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients for Arcs -->
    <linearGradient id="arcGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ff3b56" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="arcGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ff3b56" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian/Navy Canvas -->
  <rect width="1200" height="675" fill="url(#bgGlow)"/>

  <!-- Geospatial Coordinate Grid Lines (Latitude / Longitude) -->
  <g stroke="#1a2942" stroke-width="0.8" opacity="0.45" stroke-dasharray="3,6">
    <!-- Latitudes -->
    <line x1="80" y1="140" x2="1120" y2="140"/>
    <line x1="80" y1="210" x2="1120" y2="210"/>
    <line x1="80" y1="280" x2="1120" y2="280"/>
    <line x1="80" y1="350" x2="1120" y2="350"/>
    <line x1="80" y1="420" x2="1120" y2="420"/>
    <line x1="80" y1="490" x2="1120" y2="490"/>

    <!-- Longitudes -->
    <line x1="160" y1="100" x2="160" y2="530"/>
    <line x1="320" y1="100" x2="320" y2="530"/>
    <line x1="480" y1="100" x2="480" y2="530"/>
    <line x1="640" y1="100" x2="640" y2="530"/>
    <line x1="800" y1="100" x2="800" y2="530"/>
    <line x1="960" y1="100" x2="960" y2="530"/>
  </g>

  <!-- Coordinate Markings (Geographical Context) -->
  <g fill="#3a5175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="1.5">
    <text x="85" y="136">60° N</text>
    <text x="85" y="276">30° N</text>
    <text x="85" y="346">0° EQ</text>
    <text x="85" y="486">30° S</text>
    <text x="165" y="525">120° W</text>
    <text x="325" y="525">60° W</text>
    <text x="485" y="525">0° MERIDIAN</text>
    <text x="645" y="525">60° E</text>
    <text x="805" y="525">120° E</text>
  </g>

  <!-- Stylized Vector World Continents -->
  <g fill="#111c2e" stroke="#223759" stroke-width="1.2" stroke-linejoin="round" opacity="0.85">
    <!-- North America -->
    <path d="M 170 140 L 220 135 L 280 140 L 330 160 L 305 185 L 290 220 L 265 245 L 245 285 L 235 310 L 210 295 L 205 270 L 175 250 L 155 200 L 140 180 Z"/>
    <!-- Greenland -->
    <path d="M 360 115 L 400 120 L 390 155 L 350 150 Z"/>
    <!-- South America -->
    <path d="M 270 325 L 305 320 L 345 350 L 360 390 L 335 450 L 310 490 L 295 460 L 275 390 L 260 350 Z"/>
    <!-- Europe -->
    <path d="M 470 170 L 520 160 L 565 175 L 560 215 L 530 230 L 490 235 L 465 210 L 460 185 Z"/>
    <!-- Africa -->
    <path d="M 465 245 L 550 245 L 575 290 L 580 345 L 555 420 L 520 455 L 495 410 L 460 340 L 440 280 Z"/>
    <!-- Asia -->
    <path d="M 570 160 L 680 145 L 810 160 L 890 190 L 860 270 L 810 285 L 775 340 L 735 330 L 720 280 L 670 275 L 610 250 L 575 220 Z"/>
    <!-- Japan / Islands -->
    <path d="M 880 230 L 895 245 L 885 270 L 875 255 Z"/>
    <!-- Southeast Asia & Oceania -->
    <path d="M 770 365 L 810 380 L 805 400 L 765 385 Z"/>
    <!-- Australia -->
    <path d="M 795 410 L 865 405 L 895 440 L 865 485 L 800 470 L 775 435 Z"/>
  </g>

  <!-- Global Stroke Mortality & DALYs Heat Clusters (WHO High-Incidence Zones) -->
  <!-- East Asia / China Hotspot -->
  <circle cx="780" cy="240" r="85" fill="url(#hotspotRed)"/>
  <circle cx="780" cy="240" r="18" fill="#ff3b56" opacity="0.75" filter="url(#neonRed)"/>
  <circle cx="780" cy="240" r="4" fill="#ffffff"/>

  <!-- Eastern Europe / Central Asia Hotspot -->
  <circle cx="610" cy="205" r="70" fill="url(#hotspotRed)"/>
  <circle cx="610" cy="205" r="14" fill="#ff3b56" opacity="0.7" filter="url(#neonRed)"/>
  <circle cx="610" cy="205" r="3.5" fill="#ffffff"/>

  <!-- South Asia Hotspot -->
  <circle cx="715" cy="295" r="60" fill="url(#hotspotAmber)"/>
  <circle cx="715" cy="295" r="12" fill="#ff9f0a" opacity="0.8" filter="url(#neonRed)"/>
  <circle cx="715" cy="295" r="3" fill="#ffffff"/>

  <!-- Sub-Saharan Africa Hotspot -->
  <circle cx="535" cy="355" r="65" fill="url(#hotspotAmber)"/>
  <circle cx="535" cy="355" r="11" fill="#ff9f0a" opacity="0.7"/>

  <!-- North America Moderate Hotspot -->
  <circle cx="260" cy="240" r="45" fill="url(#hotspotAmber)" opacity="0.6"/>
  <circle cx="260" cy="240" r="7" fill="#ff9f0a" opacity="0.6"/>

  <!-- Epidemiological Data Arcs (Intercontinental Surveillance & Transmission) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 780 240 Q 690 140 610 205" stroke="url(#arcGrad1)" stroke-width="2.5" filter="url(#neonCyan)"/>
    <path d="M 610 205 Q 530 150 490 205" stroke="url(#arcGrad1)" stroke-width="1.8"/>
    <path d="M 610 205 Q 580 300 535 355" stroke="url(#arcGrad2)" stroke-width="2"/>
    <path d="M 715 295 Q 750 260 780 240" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
    <path d="M 260 240 Q 380 120 490 205" stroke="url(#arcGrad1)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  </g>

  <!-- Central Visual Metaphor: Holographic Cerebral Vascular Network Intersecting Latitudes -->
  <g transform="translate(490, 160)" opacity="0.95">
    <!-- Brain Aura -->
    <ellipse cx="110" cy="110" rx="140" ry="120" fill="url(#brainGlow)"/>

    <!-- Neural / Vascular Tree Artery Lines -->
    <path d="M 110 210 Q 110 150 90 130 T 50 100 T 40 60" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonCyan)"/>
    <path d="M 110 210 Q 115 155 135 130 T 170 95 T 180 50" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonCyan)"/>
    <path d="M 90 130 Q 70 120 60 140 T 35 150" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8"/>
    <path d="M 135 130 Q 155 125 160 145 T 190 150" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8"/>
    <path d="M 110 150 Q 105 100 110 60 T 110 25" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    
    <!-- Acute Focal Ischemia Indicator (Stroke Lesion Node) -->
    <circle cx="60" cy="85" r="14" fill="#ff3b56" opacity="0.4" filter="url(#neonRed)"/>
    <circle cx="60" cy="85" r="5" fill="#ff3b56"/>
    <circle cx="60" cy="85" r="2" fill="#ffffff"/>

    <!-- Machine Learning Model Nodes / Feature Intersections -->
    <circle cx="110" cy="210" r="4" fill="#00f2fe"/>
    <circle cx="90" cy="130" r="3" fill="#00f2fe"/>
    <circle cx="135" cy="130" r="3" fill="#00f2fe"/>
    <circle cx="50" cy="100" r="2.5" fill="#00f2fe"/>
    <circle cx="170" cy="95" r="2.5" fill="#00f2fe"/>
    <circle cx="180" cy="50" r="2.5" fill="#00f2fe"/>
    <circle cx="40" cy="60" r="2.5" fill="#00f2fe"/>
  </g>

  <!-- Minimal Clinical Metrics Overlay Card (Bottom Left) -->
  <g transform="translate(80, 560)">
    <rect width="280" height="58" rx="6" fill="#09101d" fill-opacity="0.85" stroke="#1d2e4a" stroke-width="1"/>
    <text x="18" y="24" fill="#8ea5c8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">GLOBAL MORTALITY BURDEN</text>
    <text x="18" y="46" fill="#ff3b56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">11%</text>
    <text x="65" y="45" fill="#e1eaf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Deaths (6.6M/yr)</text>
  </g>

  <!-- Minimal Prevention Metric Card (Bottom Center-Left) -->
  <g transform="translate(380, 560)">
    <rect width="250" height="58" rx="6" fill="#09101d" fill-opacity="0.85" stroke="#1d2e4a" stroke-width="1"/>
    <text x="18" y="24" fill="#8ea5c8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">PREVENTABLE FRACTION</text>
    <text x="18" y="46" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">80%</text>
    <text x="68" y="45" fill="#e1eaf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Modifiable Risk</text>
  </g>

  <!-- Typography: Header (Few Words, High Impact) -->
  <g transform="translate(80, 75)">
    <text x="0" y="0" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">EPIDEMIOLOGY &amp; CLINICAL ML</text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">GLOBAL STROKE RISK STRATIFICATION</text>
  </g>

  <!-- Map Legend (Top Right) -->
  <g transform="translate(980, 65)">
    <!-- High Risk -->
    <circle cx="8" cy="8" r="5" fill="#ff3b56"/>
    <text x="22" y="12" fill="#bac8db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.5">High DALY / Mortality</text>
    
    <!-- Moderate Risk -->
    <circle cx="8" cy="28" r="5" fill="#ff9f0a"/>
    <text x="22" y="32" fill="#bac8db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.5">Moderate Vascular Risk</text>
    
    <!-- ML Analytics Stream -->
    <line x1="3" y1="48" x2="15" y2="48" stroke="#00f2fe" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="22" y="52" fill="#bac8db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.5">ML Prediction Stream</text>
  </g>

  <!-- Subtly Textured Frame Border -->
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#1d2e4a" stroke-width="1"/>
</svg>