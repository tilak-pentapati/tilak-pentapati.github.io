summary:
  problem: "Is occupational skill level related to how long people have lived at their current address?"
  data: "APS 2021 teaching extract: 249,997 respondents × 60 variables (108,964 complete cases), plus UK mid-year population estimates."
  methods: "Recoding SOC 2020 into 4 ONS skill levels, median and SRDI summaries, two-way cross-tabulation, chi-square test, age-based post-stratification reweighting."
  result: "A significant association (χ² = 637.8, df = 9, p < 2.2 × 10⁻¹⁶); age reweighting lowers the \"10 years or longer\" share from 47.9% to 44.5%."
  stack: ["R", "tidyverse", "knitr"]
