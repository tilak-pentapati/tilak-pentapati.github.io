# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["green central heating", "heat pumps", "residential decarbonisation", "Census 2021", "OLS regression", "interaction effects"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/r/GCH_census/index.qmd
summary:
  problem: "What determines the uptake of green central heating across local authority districts in England and Wales?"
  data: "Census 2021: 331 local authority districts × 55 variables."
  methods: "Rank-based correlation screening, nested OLS models, two-way interactions with backward elimination, a polynomial term, diagnostics (Breusch–Pagan, VIF, Durbin–Watson)."
  result: "Housing type, off-grid heating and tenure lift R² from 22.5% to 53.1% (AIC 1,255 → 1,095); detached, off-grid and owner-occupied effects interact significantly."
  stack: ["R", "tidyverse", "car", "MASS", "broom", "sjPlot"]
# Short label for the home-page skills network.
short_title: "Green heating"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "England & Wales (331 local authorities)"
  scope: national
  lat: 52.35
  lon: -3.1

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "Census 2021 local authority extract (331 LADs × 55 variables) and helper script"
      url: "https://www.ons.gov.uk/census"
      licence: "Derived from ONS Census 2021 (Open Government Licence v3.0); the prepared `.Rdata` and `Session_10_functions.R` are University of Liverpool ENVS450 course materials and are not redistributed"
      fetch: "Rebuild from ONS Census 2021 LAD tables, or obtain the course files."
      path: "`data/data_r/gch_dataNfunc/Census_2021.Rdata` and `Session_10_functions.R`"
  note: "Also needs the unpublished ENVS450 course helper package. The page loads the data from an absolute path; edit `data_path` before re-running."
