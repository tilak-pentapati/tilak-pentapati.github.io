# Shared defaults for every project page (python/ and r/ add their engine).
# Pages keep only page-specific keys and any overrides. Per-project academic
# metadata (summary card, keywords, date-modified, code-links) lives in each
# project folder's own _metadata.yml so editing it never invalidates the
# page's _freeze/ entry (the freeze hash covers only the .qmd file).
author:
  - name:
      given: Jay Tilak
      family: Pentapati
    url: https://tilak-pentapati.github.io
    # orcid: 0000-0000-0000-0000  # TODO: add ORCID iD once registered
toc: true
toc-depth: 6
toc-location: right
number-sections: true

# TODO (decision): choose a content licence, then uncomment, e.g.
# license: "CC BY 4.0"
# license: "CC BY-NC 4.0"

# Pages that cite with [@key] use this local IEEE style (no network fetch).
csl: ../assets/csl/ieee.csl

# Engineering summary card at the top of each page (reads `summary:`).
filters:
  - ../assets/filters/summary-card.lua

format:
  html:
    highlight-style: github
    code-tools: true
    code-fold: true
    embed-resources: false
    html-math-method: katex
    fig-align: center
    fig-width: 10
    fig-height: 6
    df-print: paged
execute:
  echo: true
  warning: false
  message: false
