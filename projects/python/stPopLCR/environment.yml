# Python environment for projects/python/stPopLCR/index.qmd
# Generated by scripts/build_env_specs.py from the local `envs563` conda env
# (the env the committed _freeze/ was rendered with). Only the packages the
# page imports are listed, plus the Quarto render toolchain.
#   micromamba create -n stpoplcr -f projects/python/stPopLCR/environment.yml
# or, in the dev container / Binder: scripts/repro/setup-env.sh projects/python/stPopLCR

name: stpoplcr
channels:
  - conda-forge
dependencies:
  - python=3.14.6
  - geopandas=1.1.4
  - pyogrio=0.12.1
  - rasterio=1.5.0
  - shapely=2.1.2
  - numpy=2.5.2
  - pandas=3.0.5
  - matplotlib=3.11.1
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.11.0
  - pyyaml=6.0.3
