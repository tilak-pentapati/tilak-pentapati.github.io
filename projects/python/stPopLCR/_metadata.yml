# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["workplace population", "residential population", "population change", "Liverpool City Region", "census 2011", "raster analysis"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/python/stPopLCR/index.qmd
summary:
  problem: "How do daytime (workplace) and night-time (residential) populations differ across the Liverpool City Region, and how did population shift between 1991 and 2011?"
  data: "2011 Census workplace zones and LSOAs, workplace social grade (WP613EW), UK Data Service PopChange 1 km grids (1991, 2011), major-employer locations."
  methods: "Density choropleths with Jenks and quantile classes, high-density cluster thresholds, raster change classification, district summary tables."
  result: "Daytime workplace population of 987,210 against 1,506,940 night-time residents; mean LCR density fell from 2,087 to 2,065 persons/km² while the national mean rose."
  stack: ["Python", "GeoPandas", "Rasterio", "Matplotlib", "QGIS"]
# Short label for the home-page skills network.
short_title: "LCR population"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "Liverpool City Region"
  scope: regional
  lat: 53.402
  lon: -2.977
  radius_km: 22

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "CDRC 2011 Census GeoData, Workplace and Residential Data Packs (Liverpool City Region)"
      url: "https://data.cdrc.ac.uk/"
      licence: "Open Government Licence v3.0 (free CDRC registration)"
      fetch: "Download the 2011 Census Workplace and Residential Data Packs for the six LCR districts."
      path: "`data/data_python/stPopLCR/workplace/` and `residential/`"
    - name: "PopChange 1 km population grids, 1991 and 2011"
      url: "https://popchange-data.liverpool.ac.uk/"
      licence: "Census-derived open data; see the PopChange site for terms"
      fetch: "Download the 1991 (TP91Bs) and 2011 (URPopAll) ASCII grids."
      path: "`data/data_python/stPopLCR/raster/`"
    - name: "ONS LAD (May 2020) boundaries and OS VectorMap District functional sites"
      url: "https://geoportal.statistics.gov.uk/"
      licence: "Open Government Licence v3.0 (contains OS data © Crown copyright)"
      fetch: "ONS Open Geography Portal; major employers digitised from OS VectorMap District."
      path: "`data/data_python/stPopLCR/boundaries/` and `workplace/`"
  note: "The page looks for the data relative to the project root."
