summary:
  problem: "Where should Marks & Spencer open a new convenience store with Click & Collect in Liverpool?"
  data: "298 Liverpool LSOAs: CDRC Internet User Classification 2018, IMD 2019, BRES daytime population 2020, Geolytix retail points 2023, road-network service areas."
  methods: "Three-stage multi-criteria screening (demand → competition → site), fixed vs network drive-distance catchments, store-to-LSOA distance matrix."
  result: "Optimal site on the Wavertree / Childwall / Allerton border, outside competitors' 1,500 m drive catchments; a 500 m network catchment covers 27.9% less area than a Euclidean buffer."
