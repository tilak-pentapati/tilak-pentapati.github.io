# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["retail site selection", "catchment analysis", "network analysis", "Click & Collect", "Internet User Classification", "Liverpool"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/python/retail_site_select/index.qmd
summary:
  problem: "Where should Marks & Spencer open a new convenience store with Click & Collect in Liverpool?"
  data: "298 Liverpool LSOAs: CDRC Internet User Classification 2018, IMD 2019, BRES daytime population 2020, Geolytix retail points 2023, road-network service areas."
  methods: "Three-stage multi-criteria screening (demand → competition → site), fixed vs network drive-distance catchments, store-to-LSOA distance matrix."
  result: "Optimal site on the Wavertree / Childwall / Allerton border, outside competitors' 1,500 m drive catchments; a 500 m network catchment covers 27.9% less area than a Euclidean buffer."
  stack: ["Python", "GeoPandas", "pandas", "Matplotlib", "QGIS", "ArcGIS Pro"]
# Short label for the home-page skills network.
short_title: "Retail site selection"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "Liverpool (298 LSOAs)"
  scope: local
  lat: 53.408
  lon: -2.92
  radius_km: 7

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "CDRC Internet User Classification 2018, IMD 2019 and Retail Centre Boundaries"
      url: "https://data.cdrc.ac.uk/"
      licence: "Open Government Licence v3.0 / CDRC open data terms (free registration)"
      fetch: "Download from the CDRC data portal and clip to Liverpool LSOAs."
      path: "`data/data_python/retail_site_select/demand/` and `boundaries/`"
    - name: "Business Register and Employment Survey 2020 (workplace population)"
      url: "https://www.nomisweb.co.uk/"
      licence: "Open Government Licence v3.0"
      fetch: "Nomis query for Liverpool LSOAs; joined to LSOA polygons as `Daytime_Pop_2020_Liverpool.shp`."
      path: "`data/data_python/retail_site_select/demand/`"
    - name: "Geolytix Retail Points (Foodstores), August 2023"
      url: "https://geolytix.com/blog/supermarket-retail-points/"
      licence: "Geolytix Open Data licence (attribution required)"
      fetch: "Download the retail points CSV and filter to Liverpool."
      path: "`data/data_python/retail_site_select/supply/`"
    - name: "ONS LAD (May 2020) boundaries and OS Open Roads (service areas built in QGIS)"
      url: "https://geoportal.statistics.gov.uk/"
      licence: "Open Government Licence v3.0 (contains OS data © Crown copyright)"
      fetch: "Boundaries from the ONS Open Geography Portal; road-network buffers were made in QGIS from OS Open Roads."
      path: "`data/data_python/retail_site_select/boundaries/` and `buffers_and_network/`"
  note: "These are module-prepared derivative layers; the page looks for them relative to the project root."
