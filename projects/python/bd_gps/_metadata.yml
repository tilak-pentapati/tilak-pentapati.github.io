# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["Apache Spark", "PySpark", "GPS trajectories", "GeoLife", "human mobility", "geodesic distance", "big data"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/python/bd_gps/index.qmd
summary:
  problem: "Extract per-user mobility metrics (activity, extremes, distance, speed) from raw GPS trajectory logs with distributed processing."
  data: "A sample of the Microsoft GeoLife GPS Trajectory Dataset (12 users, IDs 130–141)."
  methods: "Explicit Spark schema → GMT to GMT+8 timestamp conversion → window functions with `lag` → geodesic-distance UDF → grouped aggregation and ranking."
  result: "73,712 km of cumulative geodesic distance across all users, plus top-5 rankings for active days, weekly volume, altitude span and peak speed."
  stack: ["Python", "PySpark", "Spark SQL", "geopy"]
# Short label for the home-page skills network.
short_title: "GeoLife GPS (Spark)"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "Beijing (GeoLife trajectories)"
  scope: city
  lat: 39.9042
  lon: 116.4074
  radius_km: 30

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "Microsoft GeoLife GPS Trajectories 1.3 (users 130–141, merged to one CSV)"
      url: "https://www.microsoft.com/en-us/download/details.aspx?id=52367"
      licence: "Microsoft Research licence terms (non-commercial research use); see the download page"
      fetch: "Download and unzip GeoLife 1.3, then concatenate the `.plt` files of users 130–141 into one CSV with columns `UserID,Latitude,Longitude,AllZero,Altitude,Timestamp,Date,Time` (the module-provided sample)."
      path: "`data/data_python/bd_gps/data.txt`"
  note: "PySpark needs a JVM (openjdk is in the environment). The page reads the file from an absolute path; edit the `spark.read.csv` line before re-running."
