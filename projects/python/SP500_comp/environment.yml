# Python environment for projects/python/SP500_comp/index.qmd
# Generated by scripts/build_env_specs.py from the local `envs563` conda env
# (the env the committed _freeze/ was rendered with). Only the packages the
# page imports are listed, plus the Quarto render toolchain.
#   micromamba create -n sp500_comp -f projects/python/SP500_comp/environment.yml
# or, in the dev container / Binder: scripts/repro/setup-env.sh projects/python/SP500_comp

name: sp500_comp
channels:
  - conda-forge
dependencies:
  - python=3.14.6
  - numpy=2.5.2
  - pandas=3.0.5
  - scikit-learn=1.9.0
  - ipython=9.16.1
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.11.0
  - pyyaml=6.0.3
  - pip
  - pip:
      - plotly==7.1.0
