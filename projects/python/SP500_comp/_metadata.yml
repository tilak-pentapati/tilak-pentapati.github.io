# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["principal component analysis", "eigenportfolio", "systematic risk", "S&P 500", "dimensionality reduction", "financial time series"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/python/SP500_comp/index.qmd
summary:
  problem: "How much of S&P 500 return variance is market-wide systemic risk, and how much is sector factors or stock-specific noise?"
  data: "Daily prices for 486 continuously listed S&P 500 constituents, July 2014 to June 2017 (about 750 trading days)."
  methods: "Daily-return matrix → unnormalised and standardised PCA → scree-elbow and cumulative-variance analysis → eigenportfolio interpretation."
  result: "PC1 (the \"market mode\") explains 28.8–31.8% of variance; the scree elbow is at PC4; 226–253 PCs are needed to reach 95%."
  stack: ["Python", "pandas", "NumPy", "scikit-learn", "Matplotlib"]
# Short label for the home-page skills network.
short_title: "S&P 500 PCA"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "S&P 500 equities (non-spatial)"
  scope: non-spatial

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: environment.yml
  data:
    - name: "S&P 500 stock data, daily OHLCV for all constituents (2013–2018)"
      url: "https://www.kaggle.com/datasets/camnugent/sandp500"
      licence: "CC0 1.0 (public domain), as listed on Kaggle"
      fetch: "Download `all_stocks_5yr.csv` from Kaggle (free account) and save it as `stock_data.csv`."
      path: "`data/data_python/SP500_comp/stock_data.csv`"
  note: "The page reads the CSV from an absolute path; edit the `read_csv` line to the expected path before re-running."
