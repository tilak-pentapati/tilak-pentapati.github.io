<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="60%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Component Axis Gradients -->
    <linearGradient id="pc1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="pc2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffb199" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff4e50" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="pc3Grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7028e4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#e5b2ca" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #00f2fe;
    }
    .axis-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #ffffff;
      text-transform: uppercase;
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1000" height="650" fill="url(#bgGlow)" />

  <!-- High-Dimensional Grid Lines -->
  <g opacity="0.10" stroke="#3a7bd5" stroke-width="1">
    <path d="M 100 500 L 900 500 M 100 400 L 900 400 M 100 300 L 900 300 M 100 200 L 900 200" />
    <path d="M 200 100 L 200 600 M 350 100 L 350 600 M 500 100 L 500 600 M 650 100 L 650 600 M 800 100 L 800 600" />
    <path d="M 500 325 L 100 600 M 500 325 L 900 600 M 500 325 L 150 100 M 500 325 L 850 100" stroke-dasharray="4,6" />
  </g>

  <!-- Nested Covariance Ellipsoids -->
  <g transform="translate(500, 325) rotate(-32)">
    <ellipse cx="0" cy="0" rx="340" ry="130" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,7" opacity="0.25" />
    <ellipse cx="0" cy="0" rx="260" ry="95" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.35" />
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="#00f2fe" fill-opacity="0.04" stroke="#00f2fe" stroke-width="2" opacity="0.6" filter="url(#glow)" />
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="#4facfe" fill-opacity="0.1" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Asset Data Cloud -->
  <g opacity="0.85">
    <line x1="390" y1="210" x2="415" y2="280" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.4" />
    <line x1="620" y1="410" x2="580" y2="340" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.4" />
    <line x1="560" y1="240" x2="540" y2="290" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.4" />

    <circle cx="500" cy="325" r="4.5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="460" cy="300" r="2.8" fill="#00f2fe" />
    <circle cx="540" cy="350" r="3.2" fill="#00f2fe" />
    <circle cx="430" cy="280" r="2.5" fill="#4facfe" />
    <circle cx="570" cy="370" r="3.0" fill="#4facfe" />
    <circle cx="380" cy="250" r="2.2" fill="#00f2fe" />
    <circle cx="620" cy="400" r="2.6" fill="#00f2fe" />
    <circle cx="390" cy="210" r="3" fill="#ffb199" filter="url(#glow)" />
    <circle cx="620" cy="410" r="3" fill="#ff4e50" filter="url(#glow)" />
    <circle cx="560" cy="240" r="2.5" fill="#00f2fe" />
    <circle cx="440" cy="410" r="2.5" fill="#00f2fe" />
    <circle cx="330" cy="360" r="2" fill="#ffb199" />
    <circle cx="680" cy="260" r="2.5" fill="#ff4e50" />
  </g>

  <!-- Principal Component 2 -->
  <g filter="url(#glow)">
    <line x1="400" y1="165" x2="600" y2="485" stroke="url(#pc2Grad)" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="608,498 590,485 608,472" fill="#ff4e50" />
  </g>

  <!-- Principal Component 3 -->
  <g filter="url(#glow)">
    <line x1="500" y1="460" x2="500" y2="140" stroke="url(#pc3Grad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" />
    <polygon points="500,125 493,145 507,145" fill="#e5b2ca" />
  </g>

  <!-- Principal Component 1: Market Mode Vector -->
  <g filter="url(#glow)">
    <line x1="230" y1="495" x2="770" y2="155" stroke="url(#pc1Grad)" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="785,145 760,150 772,170" fill="#00f2fe" />
  </g>

  <!-- ==================== ESSENTIAL TEXT LABELS (3 WORDS TOTAL) ==================== -->

  <!-- Word 1: "PCA" (Tag / Method) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="1.2" />
    <text x="40" y="20" text-anchor="middle" class="badge-text" filter="url(#glow)">PCA</text>
  </g>

  <!-- Words 2 & 3: "MARKET MODE" (Oriented along the primary eigenvector) -->
  <g transform="translate(720, 130) rotate(-32)">
    <text x="0" y="0" class="axis-label" filter="url(#glow)">Market Mode</text>
  </g>
</svg>