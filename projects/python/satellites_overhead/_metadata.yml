# Per-page metadata for this project (kept out of index.qmd so its
# _freeze/ hash is unaffected). Read by assets/filters/summary-card.lua.
date-modified: 2026-10-24
keywords: ["satellite tracking", "two-line element sets", "Skyfield", "REST API", "spatial join", "choropleth", "Folium"]
code-links:
  - text: Page source (.qmd)
    icon: github
    href: https://github.com/tilak-pentapati/tilak-pentapati.github.io/blob/main/projects/python/satellites_overhead/index.qmd
summary:
  problem: "How many active satellites are above each country at a given moment, and how does that change over a day?"
  data: "CelesTrak two-line element sets for all active satellites (REST API); Opendatasoft World Administrative Boundaries (256 countries, GeoJSON)."
  methods: "Skyfield orbit propagation at 4-hour steps over the current UTC day → sub-satellite points → antimeridian fix → point-in-polygon spatial join → Natural Breaks classification."
  result: "TODO: headline figure (e.g. the country with the most satellites overhead). The page builds a country × time satellite-count matrix and an interactive choropleth; counts depend on the live TLE feed."
  # Shown as a badge in the card title; the page is re-executed nightly (.github/workflows/publish.yml).
  live: "Live · updated nightly"
  stack: ["Python", "requests", "Skyfield", "GeoPandas", "Shapely", "mapclassify", "Folium"]
# Short label for the home-page skills network.
short_title: "Satellites overhead"

# Study area for the home-page map (scripts/build_projects_json.py).
# scope: local | regional | city | national | global | non-spatial | offworld;
# lat/lon (WGS84) only for mapped scopes, radius_km draws an extent circle.
study_area:
  label: "Global (256 countries)"
  scope: global

# Reproducibility: "Reproduce" badges in the summary card and the "Data
# availability" appendix (assets/filters/summary-card.lua), and the aggregated
# data/README.md (scripts/build_data_readme.py). `env` is relative to this folder.
reproduce:
  env: requirements.txt
  data:
    - name: "CelesTrak GP element sets (TLE), active satellites"
      url: "https://celestrak.org/NORAD/elements/"
      licence: "Free public data from CelesTrak (attribution requested)"
      fetch: "Fetched by the page from the CelesTrak API; set `SAT_LIVE=1` to force a fresh download."
      path: "`projects/python/satellites_overhead/active_satellites_cache.txt` (committed cache)"
    - name: "World Administrative Boundaries, Countries and Territories (Opendatasoft)"
      url: "https://public.opendatasoft.com/explore/dataset/world-administrative-boundaries/"
      licence: "Open Government Licence v3.0 (WFP dataset, as listed on Opendatasoft)"
      fetch: "Fetched live by the page from the Opendatasoft Explore API v2.1."
      path: "none (in memory)"
  note: "No gitignored data: this page runs from the repository alone and is re-executed nightly in CI."
