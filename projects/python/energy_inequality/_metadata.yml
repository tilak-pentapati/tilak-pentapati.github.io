summary:
  problem: "Is domestic electricity use spatially unequal across England and Wales neighbourhoods, and do places converge, diverge or hold their positions over time?"
  data: "DESNZ domestic electricity (and gas) per meter for 35,672 LSOAs, 2010–2024, harmonised to 2021 boundaries; Census 2021, EPC, IMD and population covariates."
  methods: "Moran's I and FDR-corrected LISA, Theil and spatial Gini decompositions, classic, spatial and LISA Markov chains, Van Kerm mobility decomposition, Phillips–Sul convergence clubs, spatial econometric models, MGWR, event study and basis-function trend surface."
  result: "Consumption is clustered (I ≈ 0.58) and persistent; three quarters of inequality lies within local authorities; no national convergence but twelve spatially clustered clubs; heating fuel and dwelling size drive levels at distinct spatial scales."
  stack: ["Python", "GeoPandas", "PySAL (esda, giddy, inequality, spreg)", "mgwr", "statsmodels", "Observable Plot"]
