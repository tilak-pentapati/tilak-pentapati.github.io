<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Martian Atmospheric Sky -->
    <linearGradient id="marsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B1004" />
      <stop offset="45%" stop-color="#872E0D" />
      <stop offset="85%" stop-color="#C85822" />
      <stop offset="100%" stop-color="#E27838" />
    </linearGradient>

    <!-- Subsurface Regolith & Ice Matrix Gradient -->
    <linearGradient id="subsurfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A1909" />
      <stop offset="30%" stop-color="#2D0D03" />
      <stop offset="70%" stop-color="#140602" />
      <stop offset="100%" stop-color="#090200" />
    </linearGradient>

    <!-- Ice Vein Pattern -->
    <pattern id="iceVeins" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 35 Q 20 20 40 30 M 5 10 Q 25 25 35 5" fill="none" stroke="#4FE1FA" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="12" cy="18" r="1.5" fill="#4FE1FA" fill-opacity="0.6" />
      <circle cx="28" cy="32" r="1" fill="#FFFFFF" fill-opacity="0.5" />
    </pattern>

    <!-- Blueprint Grid Overlay -->
    <pattern id="cadGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.1" />
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#FFFFFF" />
    </marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#4FE1FA" />
    </marker>
  </defs>

  <!-- ========================================== -->
  <!-- 1. MARTIAN SKY & TERRAIN LANDSCAPE (TOP)   -->
  <!-- ========================================== -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#marsSky)" />
  <rect x="0" y="0" width="1200" height="800" fill="url(#cadGrid)" />

  <!-- Low Incident Setting Sun (Mars 68°N / Moon Pole ~1.5°) -->
  <circle cx="980" cy="245" r="24" fill="#FFEACC" fill-opacity="0.85" />
  <circle cx="980" cy="245" r="55" fill="#FFEACC" fill-opacity="0.12" />
  <line x1="900" y1="245" x2="1060" y2="245" stroke="#FFEACC" stroke-width="0.75" stroke-dasharray="4 4" />

  <!-- Distant Martian Hills / Crater Rim -->
  <path d="M 0 280 Q 220 220 460 255 T 900 240 Q 1050 215 1200 260 L 1200 340 L 0 340 Z" fill="#6A2109" />
  <path d="M 0 295 Q 180 270 420 285 T 850 275 Q 1020 265 1200 290 L 1200 340 L 0 340 Z" fill="#91330F" />
  
  <!-- Surface Dunes & Boulders -->
  <ellipse cx="220" cy="335" rx="35" ry="10" fill="#421405" />
  <ellipse cx="850" cy="336" rx="20" ry="6" fill="#421405" />
  <path d="M 0 325 Q 350 310 700 330 T 1200 320 L 1200 340 L 0 340 Z" fill="#B34418" />

  <!-- ========================================== -->
  <!-- 2. 45kg LANDER BUS & DRIVE MAST ON SURFACE -->
  <!-- ========================================== -->
  <!-- Lander Footpads & Tripod Struts -->
  <line x1="480" y1="330" x2="430" y2="280" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="460" y1="332" x2="500" y2="332" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="720" y1="330" x2="770" y2="280" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="700" y1="332" x2="740" y2="332" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Lander Equipment Deck (45 kg class) -->
  <polygon points="420,280 470,230 730,230 780,280" fill="#2E0C02" stroke="#FFFFFF" stroke-width="1.8" />
  <text x="545" y="260" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF" letter-spacing="1">45kg LANDER BUS</text>

  <!-- Vertical Solar Array Wings (for ~1.5° low sun) -->
  <rect x="350" y="110" width="16" height="170" fill="#152B3C" stroke="#FFFFFF" stroke-width="1.2" />
  <line x1="350" y1="150" x2="366" y2="150" stroke="#FFFFFF" stroke-width="0.8" />
  <line x1="350" y1="190" x2="366" y2="190" stroke="#FFFFFF" stroke-width="0.8" />
  <line x1="350" y1="230" x2="366" y2="230" stroke="#FFFFFF" stroke-width="0.8" />
  <text x="330" y="210" font-family="'Courier New', monospace" font-size="8.5" fill="#FFFFFF" transform="rotate(-90 330,210)">VERTICAL SOLAR WING</text>

  <rect x="834" y="110" width="16" height="170" fill="#152B3C" stroke="#FFFFFF" stroke-width="1.2" />
  <line x1="834" y1="150" x2="850" y2="150" stroke="#FFFFFF" stroke-width="0.8" />
  <line x1="834" y1="190" x2="850" y2="190" stroke="#FFFFFF" stroke-width="0.8" />
  <line x1="834" y1="230" x2="850" y2="230" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- Drill Mast Tower -->
  <rect x="585" y="70" width="30" height="210" fill="#190702" stroke="#FFFFFF" stroke-width="1.8" />
  <!-- Lead-screw thread lines -->
  <line x1="590" y1="80" x2="610" y2="90" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" />
  <line x1="590" y1="100" x2="610" y2="110" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" />
  <line x1="590" y1="120" x2="610" y2="130" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" />
  <line x1="590" y1="140" x2="610" y2="150" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5" />

  <!-- Rotary-Percussive Drive Head -->
  <rect x="575" y="150" width="50" height="42" fill="#5E1B05" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Striker hammer indicator -->
  <rect x="587" y="158" width="26" height="14" fill="#FFFFFF" />
  <text x="635" y="165" font-family="'Courier New', monospace" font-size="8.5" fill="#FFFFFF">PERCUSSION CAM</text>
  <text x="635" y="176" font-family="'Courier New', monospace" font-size="7.5" fill="#4FE1FA">&amp; ROTARY MOTOR</text>

  <!-- =================================================== -->
  <!-- 3. SUBSURFACE GEOLOGY CUTAWAY (0.0 m TO 1.0 m)     -->
  <!-- =================================================== -->
  <rect x="0" y="340" width="1200" height="460" fill="url(#subsurfaceGrad)" />
  <rect x="0" y="420" width="1200" height="380" fill="url(#iceVeins)" />

  <!-- Surface Horizon Boundary Line -->
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#FFA366" stroke-width="2" />
  <text x="45" y="360" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFA366">SURFACE REGOLITH (0.0 m)</text>
  <text x="45" y="375" font-family="'Courier New', monospace" font-size="8.5" fill="#FFFFFF" opacity="0.7">DRY UNCONSOLIDATED DUST</text>

  <!-- Cryogenic Ice Table Line (~0.2 m depth) -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#4FE1FA" stroke-width="1.5" stroke-dasharray="6 3" />
  <text x="45" y="440" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#4FE1FA">ICE TABLE HORIZON (~0.2 m)</text>
  <text x="45" y="455" font-family="'Courier New', monospace" font-size="8.5" fill="#4FE1FA" opacity="0.8">CRYOGENIC WATER-ICE PERMAFROST (130 - 180 K)</text>

  <!-- Depth Scale Calibration (Left Side) -->
  <g transform="translate(180, 340)" stroke="#FFFFFF" stroke-width="1.2">
    <line x1="0" y1="0" x2="0" y2="400" />
    <line x1="-12" y1="0" x2="0" y2="0" />
    <line x1="-6" y1="80" x2="0" y2="80" />
    <line x1="-12" y1="160" x2="0" y2="160" />
    <line x1="-6" y1="240" x2="0" y2="240" />
    <line x1="-12" y1="320" x2="0" y2="320" />
    <line x1="-16" y1="400" x2="0" y2="400" />
  </g>
  <g transform="translate(130, 345)" font-family="'Courier New', monospace" font-size="9" fill="#FFFFFF">
    <text x="0" y="0">0.0 m</text>
    <text x="0" y="80">0.2 m</text>
    <text x="0" y="160">0.4 m</text>
    <text x="0" y="240">0.6 m</text>
    <text x="0" y="320">0.8 m</text>
    <text x="-5" y="400" font-weight="bold" fill="#4FE1FA">1.0 m</text>
  </g>

  <!-- =================================================== -->
  <!-- 4. DRILL BIT & HELICAL FLUTE SYSTEM (HERO DIAGRAM)  -->
  <!-- =================================================== -->
  <!-- Borehole Casing Channel -->
  <rect x="580" y="340" width="40" height="400" fill="#050100" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Center Drill Shaft Core -->
  <rect x="593" y="190" width="14" height="550" fill="#3D1204" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Helical Auger Flutes (Bite Sampling - Fluidless Chip Lift) -->
  <g fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1.4">
    <!-- Flute segments spiraling down the shaft -->
    <path d="M 580 355 Q 600 370 620 350 L 620 365 Q 600 385 580 370 Z" />
    <path d="M 580 405 Q 600 420 620 400 L 620 415 Q 600 435 580 420 Z" />
    <path d="M 580 455 Q 600 470 620 450 L 620 465 Q 600 485 580 470 Z" />
    <path d="M 580 505 Q 600 520 620 500 L 620 515 Q 600 535 580 520 Z" />
    <path d="M 580 555 Q 600 570 620 550 L 620 565 Q 600 585 580 570 Z" />
    <path d="M 580 605 Q 600 620 620 600 L 620 615 Q 600 635 580 620 Z" />
    <path d="M 580 655 Q 600 670 620 650 L 620 665 Q 600 685 580 670 Z" />
    <path d="M 580 705 Q 600 720 620 700 L 620 715 Q 600 735 580 720 Z" />
  </g>

  <!-- Ice Chip Transport in Flute Pockets (Cyan Dots) -->
  <g fill="#4FE1FA">
    <circle cx="587" cy="462" r="2.2" /><circle cx="590" cy="466" r="1.5" />
    <circle cx="612" cy="512" r="2.0" /><circle cx="608" cy="517" r="1.8" />
    <circle cx="588" cy="612" r="2.5" /><circle cx="592" cy="617" r="1.7" />
    <circle cx="613" cy="662" r="2.2" /><circle cx="609" cy="668" r="1.9" />
    <circle cx="590" cy="712" r="2.5" /><circle cx="610" cy="714" r="2.2" />
  </g>

  <!-- Tungsten Carbide Cutter Head (At 1.0m Target Depth) -->
  <g transform="translate(580, 730)">
    <!-- Cutter Base Block -->
    <polygon points="0,0 40,0 35,16 5,16" fill="#FFFFFF" stroke="#4FE1FA" stroke-width="1.5" />
    
    <!-- Tungsten Carbide Teeth (Aggressive Chisel Profile) -->
    <polygon points="2,16 9,28 16,16" fill="#FFEACC" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="17,16 20,32 23,16" fill="#4FE1FA" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="24,16 31,28 38,16" fill="#FFEACC" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Percussive Shockwave Rings in Ice -->
    <path d="M -15 32 Q 20 48 55 32" fill="none" stroke="#4FE1FA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <path d="M -30 42 Q 20 64 70 42" fill="none" stroke="#4FE1FA" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
  </g>

  <!-- =================================================== -->
  <!-- 5. ENGINEERING CALLOUTS & DATA BLOCKS (RIGHT SIDE)  -->
  <!-- =================================================== -->
  <!-- Callout 1: Mechanical Flute Action -->
  <g transform="translate(640, 520)">
    <line x1="-15" y1="0" x2="35" y2="0" stroke="#FFFFFF" stroke-width="1" />
    <text x="45" y="-5" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#FFFFFF">DRY MECHANICAL AUGERING</text>
    <text x="45" y="8" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF" opacity="0.7">ZERO FLUID // LOW-G CHIP CONVEYANCE</text>
  </g>

  <!-- Callout 2: Sublimation Control (T < 210 K) -->
  <g transform="translate(640, 615)">
    <line x1="-15" y1="0" x2="35" y2="0" stroke="#4FE1FA" stroke-width="1" />
    <text x="45" y="-5" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#4FE1FA">THERMAL PRESERVATION ZONE</text>
    <text x="45" y="8" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF" opacity="0.8">T &lt; 210 K (PREVENTS VOLATILE FLASHING)</text>
  </g>

  <!-- Callout 3: Carbide Cutting Edges & Percussion -->
  <g transform="translate(640, 742)">
    <line x1="-20" y1="0" x2="35" y2="0" stroke="#FFEACC" stroke-width="1" />
    <text x="45" y="-7" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#FFEACC">CARBIDE CHISEL BIT</text>
    <text x="45" y="6" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">2.0 J IMPACTS @ 25 Hz // F_rxn &lt; 100 N</text>
  </g>

  <!-- Force Vector Annotation (Left side of Bit) -->
  <g transform="translate(540, 725)">
    <line x1="0" y1="-30" x2="0" y2="10" stroke="#4FE1FA" stroke-width="2" marker-end="url(#cyanArrow)" />
    <text x="-80" y="-10" font-family="'Courier New', monospace" font-size="8" fill="#4FE1FA">AXIAL PERCUSSION</text>
    
    <path d="M 5 -10 A 15 15 0 0 0 -15 -10" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />
    <text x="-65" y="-22" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">TORQUE (τ)</text>
  </g>

  <!-- Technical Spec Box (Bottom Right) -->
  <g transform="translate(860, 680)">
    <rect x="0" y="0" width="300" height="85" fill="#140401" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85" />
    <text x="12" y="18" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#FFA366">OPERATIONAL ENVELOPE (MARS / MOON):</text>
    <text x="12" y="34" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">• 10x 100mm DISCRETE BITES (NO STUCK BIT)</text>
    <text x="12" y="48" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">• WOB: &lt; 100 N (MATCHES 45kg WEIGHT ON MARS)</text>
    <text x="12" y="62" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">• STRATIFIED DEPTH-TAGGED CAROUSEL OFFLOAD</text>
    <text x="12" y="76" font-family="'Courier New', monospace" font-size="7.5" fill="#4FE1FA">tilak-pentapati.github.io/Low-Gravity_Rotary-Percussive_Bite-Drilling_System/</text>
  </g>

  <!-- Title Watermark -->
  <text x="45" y="775" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FFFFFF" opacity="0.6">RPBD // 1.0 m BITE-DRILL SUBSURFACE MARS SAMPLER</text>
</svg>